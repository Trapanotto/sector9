<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FP Arms Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9aa3ab; }
    #ui { position: fixed; right: 8px; top: 8px; font: 13px monospace; background: #000a; color: #fff; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    #ui select { font: 13px monospace; }
  </style>
</head>
<body>
  <div id="ui">
    <select id="clip"></select>
    <label><input type="checkbox" id="cycle" checked /> cycle clips</label>
    <select id="view"><option value="chest">chest cam (95 / viewmodel 70)</option><option value="eye">eye cam</option><option value="orbit">orbit inspect</option></select>
  </div>
  <script type="module" src="./arms.js"></script>
</body>
</html>
